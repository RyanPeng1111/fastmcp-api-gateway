name: Verify and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ryanpeng1111/fastmcp-api-gateway
  IMAGE_VERSION: 0.1.0

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact image to be scanned
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          pull: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}

      - name: Enforce image size below 2 GiB
        shell: bash
        run: |
          image_size="$(docker image inspect '${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}' --format '{{.Size}}')"
          max_size="$((2 * 1024 * 1024 * 1024))"
          echo "Image size: ${image_size} bytes"
          if (( image_size >= max_size )); then
            echo "Image must be smaller than 2 GiB" >&2
            exit 1
          fi

      - name: Block Critical vulnerabilities
        # v0.36.0, pinned to the signed release commit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

      - name: Push verified image
        shell: bash
        run: |
          docker push '${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}'
          docker push '${{ env.IMAGE_NAME }}:latest'
          docker push '${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'

      - name: Publish summary
        shell: bash
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.IMAGE_NAME }}:sha-${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
