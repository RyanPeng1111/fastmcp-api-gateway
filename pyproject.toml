[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fastmcp-api-gateway"
version = "0.1.0"
description = "Stateless MCP gateway for OpenAPI, GraphQL and Skills"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastmcp==4.0.0",
  "graphql-core==3.2.6",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "PyYAML==6.0.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastmcp_api_gateway"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
